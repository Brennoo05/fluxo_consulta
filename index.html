                <div class="flex gap-2 flex-wrap sm:justify-end">
                <button onclick="salvarAnotacaoPrivada(${c.id})" class="btn-ghost px-3 py-2 text-xs font-medium">📝 Salvar nota</button>
                
                <button onclick="marcarConsultaDadaConsulta(${c.id})" class="btn-primary px-3 py-2 text-xs font-medium">✓ Compareceu</button>
                <button onclick="registrarFaltaConsulta(${c.id})" class="btn-brick px-3 py-2 text-xs font-medium">Faltou</button>
                </div></div>
            </div>`;
          }).join('') : `<div class="card bg-white p-5 text-sm text-[var(--ink-soft)]">Nenhuma consulta confirmada pendente. Quando um paciente agendar com você, ela aparecerá aqui.</div>`}
        </div>

        <div class="mt-5">
          <div class="flex items-center justify-between border-b border-[var(--line)] pb-2 mb-3">
            <div><h4 class="text-sm font-medium">Histórico de atendimentos</h4><p class="text-xs text-[var(--ink-soft)] mt-1">Resultado dos atendimentos já encerrados.</p></div>
          </div>
          ${encerradasRecentes.length ? encerradasRecentes.map(x=>{const h=x.horario,c=x.consulta,p=getPaciente(c.pacienteId);return `<div class="card bg-white p-3 flex items-center justify-between gap-3 mb-2"><div><div class="text-sm font-medium">${escaparHtml(p?.nome||'Paciente')}</div><div class="text-xs text-[var(--ink-soft)]">${formatarDataCurta(h.data)} · ${h.hora}</div></div><div class="text-right"><span class="badge ${c.status==='realizada'?'badge-livre':'badge-lotado'}">${c.status==='realizada'?'Realizada':'Faltou'}</span>${(state.anotacoesPrivadas[c.id]||[]).slice(-1).map(n=>`<div class="text-[11px] text-[var(--ink-soft)] mt-1 max-w-[260px]">📝 ${escaparHtml(n.texto)}</div>`).join('')}</div></div>`}).join('') : `<div class="card bg-white p-4 text-sm text-[var(--ink-soft)]">Nenhum atendimento encerrado ainda.</div>`}
        </div>

        <div class="mt-5">
          <div class="flex items-center justify-between border-b border-[var(--line)] pb-2 mb-3"><div><h4 class="text-sm font-medium">Cancelamentos recentes</h4><p class="text-xs text-[var(--ink-soft)] mt-1">Nada é apagado: cancelamentos continuam registrados.</p></div></div>
          ${canceladasRecentes.length ? canceladasRecentes.map(c=>{const p=getPaciente(c.consulta.pacienteId);return `<div class="card bg-white p-3 flex items-center justify-between gap-3 mb-2"><div><div class="text-sm font-medium">${escaparHtml(p?.nome||'Paciente')}</div><div class="text-xs text-[var(--ink-soft)]">${formatarDataCurta(c.horario.data)} · ${c.horario.hora} · ${c.horario.modalidade==='online'?'💻 Online':'📍 Presencial'}</div></div><span class="badge badge-concluido">Cancelada</span></div>`}).join('') : `<div class="card bg-white p-4 text-sm text-[var(--ink-soft)]">Nenhum cancelamento recente.</div>`}
        </div>
      </div>

      ${seletorAgendas()}

      <div class="flex items-center justify-between bg-[var(--surface)] p-4 rounded-xl border border-[var(--line)] shadow-sm">
        <div>
          <h2 class="font-display text-2xl">Sua Agenda${agendaSelecionadaId ? ` <span class="text-base text-[var(--ink-soft)] font-normal">· ${escaparHtml(state.agendas.find(a=>a.id===agendaSelecionadaId)?.nome || '')}</span>` : ''}</h2>
          <p class="text-sm text-[var(--ink-soft)] capitalize">${formatarDataCompleta(state.diaSelecionado)}</p>
        </div>
        <div class="relative">
          <button data-calendar-trigger onclick="toggleCalendario()" class="btn-primary px-4 py-2 flex items-center gap-2 text-sm">
            <span>📅</span> Gerenciar Data
          </button>
          ${calendarioAberto ? `<div style="right:0;">${gerarGradeCalendario(state.usuario.id, agendaSelecionadaId, true)}</div>` : ''}
        </div>
      </div>

      <div class="space-y-3 pt-2">
        ${horariosDoDia.length ? horariosDoDia.map(h => cartaoHorario(h, 'profissional')).join('') : `<div class="card p-7 text-center bg-white"><div class="text-2xl mb-2">🗓️</div><h4 class="font-display text-lg">Dia sem horários cadastrados</h4><p class="text-sm text-[var(--ink-soft)] mt-2">Use os horários recorrentes na aba Início para criar sua agenda ou escolha outra data no calendário.</p></div>`}
      </div>`;

  const conteudoConfig = `
      <div class="card p-5 bg-white">
        <h3 class="font-medium mb-1">Lembretes e confirmação</h3>
        <p class="text-xs text-[var(--ink-soft)] mb-4">Configure quando o cliente recebe lembretes e quando a confirmação passa a ser obrigatória.</p>
        <div class="grid sm:grid-cols-2 gap-3">
          <label class="flex items-center gap-2 text-sm"><input id="cfg-24h" type="checkbox" ${state.configuracoes.lembrete24h?'checked':''}> Lembrete 24h antes</label>
          <label class="flex items-center gap-2 text-sm"><input id="cfg-2h" type="checkbox" ${state.configuracoes.lembrete2h?'checked':''}> Lembrete 2h antes</label>
          <label class="text-sm">Confirmação obrigatória com <input id="cfg-conf" type="number" min="1" max="48" value="${state.configuracoes.confirmacaoHoras}" class="w-16 border rounded px-2 py-1"> h de antecedência</label>
          <label class="text-sm">Cancelamento permitido até <input id="cfg-canc" type="number" min="0" max="72" value="${state.configuracoes.cancelamentoHoras}" class="w-16 border rounded px-2 py-1"> h antes</label>
        </div>
        <button onclick="salvarConfiguracoesAgenda()" class="btn-primary px-4 py-2 text-sm mt-4">Salvar regras</button>
      </div>

      <div class="card p-4 bg-white">
        <h3 class="font-medium mb-2">Perfil</h3>
        <p class="text-sm"><strong>Nome:</strong> ${state.usuario.nome}</p>
        <p class="text-sm"><strong>Profissão:</strong> ${state.usuario.profissao}</p>
      </div>`;

  const conteudoAba = abaProfissional === 'agenda' ? conteudoAgenda : abaProfissional === 'config' ? conteudoConfig : conteudoPainel;

  return `
    ${barraNavegacao()}
    <div class="max-w-4xl mx-auto px-4 py-6 space-y-6">
      ${conteudoAba}
    </div>`;
}



function barraNavegacao(){
  const ehPaciente = state.usuario.tipo === 'paciente';
  const ehClinica = state.usuario.tipo === 'clinica';
  const naoLidas = ehClinica ? 0 : state.notificacoes.filter(n => { const alvo = ehPaciente ? n.pacienteId === state.usuario.id : n.profissionalId === state.usuario.id; return alvo && !n.lida; }).length;

  const barraInferior = ehClinica ? `
    <nav class="mobile-bottombar">
      <button onclick="sair()"><span class="ic">↩️</span>Sair</button>
    </nav>` : ehPaciente ? `
    <nav class="mobile-bottombar">
      <button onclick="irParaAba('profissionais')" class="${abaPaciente === 'profissionais' ? 'active' : ''}"><span class="ic">🔎</span>Clínicas</button>
      <button onclick="irParaAba('consultas')" class="${abaPaciente === 'consultas' ? 'active' : ''}"><span class="ic">📋</span>Consultas</button>
      <button onclick="toggleNotificacoes()" class="${notificacoesAbertas ? 'active' : ''}" style="position:relative;"><span class="ic">🔔</span>Avisos${naoLidas > 0 ? `<span class="notif-dot" style="top:-2px;right:22%;">${naoLidas}</span>` : ''}</button>
      <button onclick="sair()"><span class="ic">↩️</span>Sair</button>
    </nav>` : `
    <nav class="mobile-bottombar">
      <button onclick="irParaAbaProfissional('painel')" class="${abaProfissional === 'painel' ? 'active' : ''}"><span class="ic">🏠</span>Início</button>
      <button onclick="irParaAbaProfissional('agenda')" class="${abaProfissional === 'agenda' ? 'active' : ''}"><span class="ic">🗓️</span>Agenda</button>
      <button onclick="toggleNotificacoes()" class="${notificacoesAbertas ? 'active' : ''}" style="position:relative;"><span class="ic">🔔</span>Avisos${naoLidas > 0 ? `<span class="notif-dot" style="top:-2px;right:14%;">${naoLidas}</span>` : ''}</button>
      <button onclick="irParaAbaProfissional('config')" class="${abaProfissional === 'config' ? 'active' : ''}"><span class="ic">⚙️</span>Config</button>
      <button onclick="sair()"><span class="ic">↩️</span>Sair</button>
    </nav>`;

  return `
    <div class="sticky top-0 z-30 border-b border-[var(--line)] bg-[var(--surface)]/95 backdrop-blur supports-[backdrop-filter]:bg-white/80">
      <div class="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between gap-3">
        <span class="font-display text-xl text-[var(--primary-dark)] flex items-center gap-1.5 flex-shrink-0">
          <span aria-hidden="true" class="inline-block w-2 h-2 rounded-full" style="background:var(--gold);"></span>Fluxo
        </span>
        <div class="flex items-center gap-2 sm:gap-3 text-sm min-w-0">
          ${!ehClinica ? `
          <div class="relative hidden sm:block">
            <button onclick="toggleNotificacoes()" class="btn-ghost px-2.5 py-1.5 text-sm relative" title="Notificações">
              🔔${naoLidas > 0 ? `<span class="notif-dot">${naoLidas}</span>` : ''}
            </button>
            ${notificacoesAbertas ? painelNotificacoes() : ''}
          </div>` : ''}
          <span class="text-[var(--ink-soft)] font-medium truncate max-w-[120px] sm:max-w-none">${ehClinica ? '🏥' : ehPaciente ? '👤' : '🩺'} ${state.usuario.nome}</span>
          <button onclick="sair()" class="btn-ghost px-3 py-1.5 text-xs hidden sm:inline-flex">Sair</button>
        </div>
      </div>
      ${ehClinica ? '' : ehPaciente ? `
      <div class="max-w-5xl mx-auto px-4 pb-3 hidden sm:block">
        <div class="tab-row">
          <span class="tab-btn ${abaPaciente === 'profissionais' ? 'active' : ''}" onclick="irParaAba('profissionais')">Clínicas</span>
          <span class="tab-btn ${abaPaciente === 'consultas' ? 'active' : ''}" onclick="irParaAba('consultas')">Minhas Consultas</span>
        </div>
      </div>` : `
      <div class="max-w-5xl mx-auto px-4 pb-3 hidden sm:block">
        <div class="tab-row">
          <span class="tab-btn ${abaProfissional === 'painel' ? 'active' : ''}" onclick="irParaAbaProfissional('painel')">Início</span>
          <span class="tab-btn ${abaProfissional === 'agenda' ? 'active' : ''}" onclick="irParaAbaProfissional('agenda')">Agenda</span>
          <span class="tab-btn ${abaProfissional === 'config' ? 'active' : ''}" onclick="irParaAbaProfissional('config')">Configurações</span>
        </div>
      </div>`}
    </div>
    <div class="sm:hidden">${!ehClinica && notificacoesAbertas ? painelNotificacoes() : ''}</div>
    ${barraInferior}`;
}

function badgeStatus(status){
  const mapa = {
    livre: ['Livre', 'badge-livre'],
    ocupado: ['Ocupado', 'badge-ocupado'],
    lotado: ['Lotado (com fila)', 'badge-lotado'],
    concluido: ['Encerrado', 'badge-concluido'],
  };
  const [label, classe] = mapa[status] || [status, ''];
  return `<span class="badge ${classe}">${label}</span>`;
}

function cartaoHorario(h, visao = 'paciente'){
  const isProf = visao === 'profissional';
  
  // Lógica Paciente
  if (!isProf) {
    const pacienteAtual = state.usuario.id;
    const jaAgendado = h.pacienteId === pacienteAtual;
    const naFila = h.fila.includes(pacienteAtual);
    const posicaoFila = h.fila.indexOf(pacienteAtual) + 1;

    let acao = '';
    if (h.status === 'concluido') {
      acao = `<span class="text-xs text-[var(--ink-soft)]">Indisponível</span>`;
    } else if (jaAgendado) {
      acao = `<span class="text-xs font-medium text-[var(--primary-dark)]">Sua consulta ✓</span>`;
    } else if (naFila) {
      acao = `<span class="text-xs font-medium text-[var(--gold)]">Na fila (pos. ${posicaoFila})</span>`;
    } else if (h.status === 'livre') {
      acao = `<button onclick="agendarComFeedback(${pacienteAtual}, ${h.id}, this)" class="btn-primary px-3 py-1.5 text-xs font-medium">Agendar</button>`;
    } else {
      acao = `<button onclick="agendarComFeedback(${pacienteAtual}, ${h.id}, this)" class="btn-ghost px-3 py-1.5 text-xs font-medium">Entrar na fila (${h.fila.length})</button>`;
    }

    return `
      <div class="card p-4 flex items-center justify-between gap-3 bg-white hover:border-[var(--primary)] transition">
        <div>
          <div class="flex items-center gap-2">
            <span class="font-display text-lg tabular text-[var(--primary-dark)]">${h.hora}</span>
            <span class="text-xs px-2 py-0.5 rounded-md bg-[var(--bg)]">${h.modalidade === 'online' ? '💻 Online' : '📍 Presencial'}</span>
          </div>
          <div class="mt-2">${badgeStatus(h.status)}</div>
        </div>
        <div>${acao}</div>
      </div>`;
  }
  
  // Lógica Profissional
  const paciente = h.pacienteId ? getPaciente(h.pacienteId) : null;
  const filaHtml = h.fila.length ? `
    <div class="flex items-center gap-1.5 mt-2">
      ${h.fila.map((pid, i) => `<span class="queue-chip" title="${getPaciente(pid)?.nome}">${i+1}</span>`).join('')}
      <span class="text-xs text-[var(--ink-soft)] ml-1">${h.fila.map(pid => getPaciente(pid)?.nome).join(', ')}</span>
    </div>` : '';

  const acoes = h.status === 'concluido' ? `<span class="text-xs text-[var(--ink-soft)] border px-2 py-1 rounded">Encerrado</span>` :
    (h.status === 'livre' ? `<span class="text-xs text-[var(--ink-soft)]">Sem paciente</span>` : `
      <div class="flex flex-col gap-2">
        <button onclick="marcarConsultaDada(${h.id})" class="btn-primary px-3 py-1.5 text-xs font-medium w-full">Compareceu</button>
        <button onclick="registrarFalta(${h.id})" class="btn-brick px-3 py-1.5 text-xs font-medium w-full">Faltou</button>
      </div>`);

  return `
    <div class="card p-4 bg-white cartao-horario flex items-start justify-between gap-3">
        <div>
          <div class="flex items-center gap-2">
            <span class="font-display text-lg tabular text-[var(--primary-dark)]">${h.hora}</span>
            <span class="text-xs px-2 py-0.5 rounded-md bg-[var(--bg)]">${h.modalidade === 'online' ? '💻 Online' : '📍 Presencial'}</span>
            ${badgeStatus(h.status)}
          </div>
          <p class="text-sm mt-2">${paciente ? `Paciente: <strong class="text-[var(--ink)]">${paciente.nome}</strong>` : '<span class="text-[var(--ink-soft)]">Livre</span>'}</p>
          ${filaHtml}
        </div>
        <div class="min-w-[100px] text-right">${acoes}</div>
    </div>`;
}


function render(){
  const app = document.getElementById('app');
  if (!app) return;
  try {
    processarLembretes();
    salvarDados();
    if (!state.usuario) {
      app.innerHTML = telaLogin();
      iniciarAnimacaoHero();
    } else if (state.usuario.tipo === 'paciente') {
      app.innerHTML = telaPaciente();
    } else if (state.usuario.tipo === 'clinica') {
      app.innerHTML = telaClinica();
    } else {
      app.innerHTML = telaProfissional();
    }
    renderToasts();
  } catch (erro) {
    console.error('Erro ao renderizar Fluxo:', erro);
    app.innerHTML = `<div class="min-h-screen flex items-center justify-center p-6"><div class="card bg-white p-7 max-w-md text-center"><h2 class="font-display text-2xl mb-2">Não foi possível carregar esta tela</h2><p class="text-sm text-[var(--ink-soft)] mb-4">Seus dados foram preservados. Tente recarregar a página.</p><button onclick="location.reload()" class="btn-primary px-4 py-2">Recarregar</button></div></div>`;
  }
}

carregarDados();
render();
setInterval(() => { processarLembretes(); salvarDados(); }, 60000);
</script>


</body>
</html>
